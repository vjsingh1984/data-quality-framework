[tool.poetry]
name = "data-quality-framework"
version = "2.0.0"
description = "A flexible data quality framework with engine extensibility using Python reflection"
authors = ["Data Quality Framework Contributors"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/vjsingh1984/data-quality-framework"
repository = "https://github.com/vjsingh1984/data-quality-framework"
documentation = "https://github.com/vjsingh1984/data-quality-framework#documentation"
keywords = ["data-quality", "spark", "deequ", "great-expectations", "data-validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
packages = [{include = "dq"}]

# Poetry performance configuration (applied via CLI/env vars)

[tool.poetry.dependencies]
python = "^3.11"

# ULTRA-LIGHT CORE DEPENDENCIES ONLY
# Essential for framework functionality
pyhocon = "^0.3.59"              # Configuration parsing (HOCON format)
pyyaml = "^6.0"                  # YAML configuration support
requests = "^2.28.0"             # HTTP requests (for remote config)

# Windows compatibility (lightweight)
pywin32-ctypes = {version = "^0.2.0", markers = "sys_platform == 'win32'"}

# Optional heavy dependencies (install with poetry install -E <extra>)
pyspark = {version = "^3.5.0", optional = true}
pydeequ = {version = "^1.2.1", optional = true}
boto3 = {version = "^1.26.0", optional = true}
cron-schedule-triggers = {version = "^0.0.11", optional = true}
great-expectations = {version = ">=0.18.0,<1.0", optional = true}

[tool.poetry.extras]
spark = ["pyspark"]
deequ = ["pydeequ"]
aws = ["boto3"]
cron = ["cron-schedule-triggers"]
ge = ["great-expectations"]

# Minimal development dependencies (only for CI)
[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"               # Testing only
pytest-mock = "^3.10.0"         # Mock support for unit tests
black = "^23.0.0"               # Code formatting only
ruff = "^0.4.0"                 # Fast Python linter
flake8 = "^6.0.0"               # Linting only
bandit = "^1.7.5"               # Security scanning only
safety = "^3.0.0"               # Dependency security check

[tool.poetry.scripts]
dq-framework = "dq.cli:main"
dq-validate = "dq.validate:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Optimized tool configurations for CI performance
[tool.black]
line-length = 88
target-version = ['py311', 'py312']
fast = true                     # Fast mode for CI
quiet = true                    # Reduce output

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["dq/tests"]
addopts = "-v --tb=short --no-header --no-summary -q"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "spark: Spark integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.flake8]
max-line-length = 88
extend-ignore = "E203,W503"
jobs = 4                        # Parallel processing
statistics = false              # Reduce output
count = true                    # Count errors only

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv"]
skips = ["B101", "B108", "B307", "B608"]  # B101=assert, B108=tmp, B307=eval(hardened), B608=SQL(validated)
quiet = true                    # Reduce output

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["dq/notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E501", "E712", "E731", "E741", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"dq/tests/*" = ["E101", "E402", "F841", "W291", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["dq"]

[tool.coverage.run]
source = ["dq"]
omit = [
    "*/tests/*",
    "*/test_*",
    "build/*",
    "dist/*",
    ".venv/*",
]
parallel = true                 # Parallel coverage collection

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = false            # Reduce output
skip_empty = true               # Skip empty files