name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Install dependencies
        run: poetry install --with dev
      - name: Check formatting
        run: poetry run black --check dq/
      - name: Lint
        run: >-
          poetry run flake8 dq/ --exclude=dq/notebooks
          --select E9,F63,F7,F82
      - name: Security scan
        run: poetry run bandit -r dq/ -x tests -s B101 -lll -q
      - name: Dependency audit
        run: poetry run pip-audit --skip-editable

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Install dependencies
        run: |
          poetry install --with dev -E spark -E aws
          # PyDeequ permits pandas>=0.23 while the optional cron extra pins
          # pytz==2019.3, so Poetry otherwise selects pandas 1.3.5 without
          # Python 3.11/3.12 wheels. Keep the tested Deequ stack explicit.
          poetry run pip install pandas==2.2.3
          poetry run pip install --no-deps pydeequ==1.6.0
      - name: Download Deequ JAR
        run: |
          mkdir -p lib
          wget -q -O lib/deequ-2.0.8-spark-3.5.jar \
            https://repo1.maven.org/maven2/com/amazon/deequ/deequ/2.0.8-spark-3.5/deequ-2.0.8-spark-3.5.jar
      - name: Run tests
        run: >-
          poetry run pytest dq/tests/ -v --tb=short
          --cov=dq --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-fail-under=45
        env:
          SPARK_VERSION: "3.5"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Build package
        run: poetry build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
