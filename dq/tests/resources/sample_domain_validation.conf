# Sample domain validation configuration for tests
dqframework {
  dqrules = [
    {
      name = "sample_domain_validation"
      engine = "deequ"
      dataframes = ["default"]
      checks = [
        {
          constraint_name = "date_complete"
          constraint = "isComplete"
          column = "Date"
          level = "Error"
        }
        {
          constraint_name = "batch_complete"
          constraint = "isComplete"
          column = "Batch"
          level = "Error"
        }
        {
          constraint_name = "region_complete"
          constraint = "isComplete"
          column = "Region"
          level = "Error"
        }
        {
          constraint_name = "recovery_non_negative"
          constraint = "isNonNegative"
          column = "Recovery"
          level = "Warning"
        }
        {
          constraint_name = "metric_6m_non_negative"
          constraint = "isNonNegative"
          column = "Metric6M"
          level = "Warning"
        }
      ]
    }
  ]
}
