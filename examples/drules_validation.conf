# Drules (declarative rules) validation example
dqframework {
  dqrules = [
    {
      name = "drules_data_quality_checks"
      engine = "drules"
      dataframes = ["default"]
      checks = [
        # Null check — ensure critical columns have no nulls
        {
          rule_type = "null_check"
          constraint_name = "id_not_null"
          column = "id"
          mode = "not_null"
        }
        # Column threshold — validate numeric ranges
        {
          rule_type = "column_threshold"
          constraint_name = "age_valid_range"
          column = "age"
          min = 0
          max = 120
        }
        # Regex — validate string format
        {
          rule_type = "regex"
          constraint_name = "email_format"
          column = "email"
          pattern = "^[^@]+@[^@]+\\.[^@]+$"
        }
        # Cross-column — validate relationships between columns
        {
          rule_type = "cross_column"
          constraint_name = "start_before_end"
          left_column = "start_date"
          right_column = "end_date"
          operator = "<"
        }
        # Custom SQL — flexible SQL-based validation
        {
          rule_type = "custom_sql"
          constraint_name = "positive_row_count"
          sql_expression = "SELECT COUNT(*) FROM {table}"
          expected_operator = ">"
          expected_value = 0
        }
      ]
    }
  ]
}
