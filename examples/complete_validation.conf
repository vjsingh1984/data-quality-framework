# Data Quality Framework Configuration Example
# This file demonstrates all available configuration options

dqframework {
  # Catalog type: unity, glue, hive, or spark
  catalog_type = "spark"

  # Observability configuration for metrics export
  observability {
    # Enable Prometheus metrics exporter
    prometheus_enabled = false
    prometheus_port = 9090

    # Enable OpenTelemetry metrics exporter
    opentelemetry_enabled = false
    opentelemetry_endpoint = "http://localhost:4318"

    # Enable Datadog metrics exporter
    datadog_enabled = false
    # datadog_api_key = "your-api-key"
    # datadog_app_key = "your-app-key"
  }

  # Pre-defined DataFrames for validation
  dataframes {
    users_table = "catalog.schema.users"
    orders_table = "catalog.schema.orders"
    products_table = "catalog.schema.products"
  }

  # Data quality rules to execute
  dqrules = [
    {
      name = "Users Data Quality Checks"
      engine = "deequ"
      dataframes = ["users_table"]

      checks = [
        {
          constraint = "Completeness"
          constraint_name = "user_id_completeness"
          column = "user_id"
        }
        {
          constraint = "Uniqueness"
          constraint_name = "email_uniqueness"
          column = "email"
        }
      ]
    }

    {
      name = "Orders Profiling"
      engine = "profiler"
      dataframes = ["orders_table"]

      # Profiler configuration
      profile_type = "comprehensive"  # basic, comprehensive, or advanced
      include_correlation = false
      max_unique_values = 100

      # Optional: Export profile report
      # export_path = "/tmp/orders_profile.json"
      # export_format = "json"
    }

    {
      name = "Custom Business Rules"
      engine = "constraint"
      dataframes = ["orders_table"]

      checks = [
        {
          constraint = "DistinctnessByGroup"
          constraint_name = "order_distinctness_by_user"
          column = "order_id"
          group_by_column = "user_id"
          min_threshold = 1
        }
      ]
    }
  ]

  # Repository for persisting metrics (optional)
  # repository {
  #   type = "filesystem"  # or "jdbc", "s3"
  #   path = "/tmp/dq-metrics"
  # }
}
